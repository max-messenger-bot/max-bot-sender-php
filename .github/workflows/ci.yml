name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          coverage: none
          tools: composer:v2

      - name: Remove static analysis tools
        run: composer remove --dev --no-update --no-interaction friendsofphp/php-cs-fixer psalm/plugin-phpunit vimeo/psalm

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit

  static-checks:
    name: Psalm and code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: curl, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run Psalm
        run: composer psalm -- --no-progress

      - name: Check code style
        run: composer cs -- --using-cache=no --sequential
